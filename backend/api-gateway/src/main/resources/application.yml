server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:nacos:api-gateway-dev.yaml   # 配置中心（optional：本地无 Nacos 也能启动）
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        fail-fast: false
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Headers Access-Control-Allow-Methods, RETAIN_UNIQUE
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            # 禁止 * + allowCredentials（docs/4 §11 D13）；按环境配置白名单
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
            allowedMethods: [ GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS ]
            allowedHeaders: [ Authorization, Content-Type, X-Trace-Id, X-Requested-With, Idempotency-Key ]
            exposedHeaders: [ X-Trace-Id, Retry-After ]
            allowCredentials: true
            maxAge: 3600
      routes:
        # Outbox 重放必须先于 /api/admin/**，否则会被 auth-admin 抢走
        - id: auth-outbox
          uri: lb://auth-service
          predicates: [ "Path=/api/admin/outbox/auth/**" ]
        - id: interview-outbox
          uri: lb://interview-service
          predicates: [ "Path=/api/admin/outbox/interview/**" ]
        - id: notify-outbox
          uri: lb://notify-service
          predicates: [ "Path=/api/admin/outbox/notify/**" ]
        - id: auth-admin
          uri: lb://auth-service
          predicates: [ "Path=/api/admin/**" ]
        - id: auth-service
          uri: lb://auth-service
          predicates: [ "Path=/api/auth/**" ]
        - id: interview-service
          uri: lb://interview-service
          predicates: [ "Path=/api/interview/**" ]
        - id: resume-service
          uri: lb://resume-service
          predicates: [ "Path=/api/resume/**" ]
        - id: room-service
          uri: lb://room-service
          predicates: [ "Path=/api/room/**" ]
        - id: notify-service
          uri: lb://notify-service
          predicates: [ "Path=/api/notify/**" ]
        - id: file-service
          uri: lb://file-service
          predicates: [ "Path=/api/file/**" ]
        # AI 编排（跨语言 REST，Java 侧无感知）
        - id: ai-service
          uri: ${AI_SERVICE_URI:http://127.0.0.1:9010}
          predicates: [ "Path=/api/ai/**" ]
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

# 网关鉴权与限流（P3）：公钥由环境变量/Nacos 注入
recruit:
  gateway:
    jwt:
      issuer: ${JWT_ISSUER:recruit-auth}
      key-id: ${JWT_KEY_ID:k1}
      public-key-path: ${JWT_PUBLIC_KEY_PATH:}
      clock-skew-seconds: 30
      previous-public-keys: {}
    rate-limit:
      global-qps: 200        # 全平台 QPS（docs/4 §10.3 P1）
      ip-qps: 50             # 单 IP QPS（P2）
      login-per-minute: 100  # 登录（P3，含失败计数）

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics

logging:
  pattern:
    level: '%5p [%X{traceId}]'
