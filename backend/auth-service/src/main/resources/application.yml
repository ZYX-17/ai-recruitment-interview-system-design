server:
  port: 8081

spring:
  application:
    name: auth-service
  # 纯 JWT 服务：不需要 Boot 默认的内存用户（否则启动会打印随机密码）
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  config:
    import: optional:nacos:auth-service-dev.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        fail-fast: false
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/recruit_auth?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true    # W1 起启用；V1_0 与 sql/01_recruit_auth.sql 同源
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id        # 雪花 ID（应用层生成）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  pattern:
    level: '%5p [%X{traceId}]'

# JWT（双令牌，密钥从环境变量/Nacos 加密配置注入，严禁入库/入仓）
recruit:
  jwt:
    issuer: recruit-auth
    access-token-ttl-minutes: 120    # 2h
    refresh-token-ttl-days: 7        # 7d
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}   # RS256 私钥（K8s Secret/环境变量）
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    clock-skew-seconds: 30           # exp/nbf 容忍 30s，不放松签名校验
    key-id: ${JWT_KEY_ID:k1}         # 当前签名 kid，写入 JWT header
    # 轮换期旧公钥：kid -> 公钥路径；旧公钥至少保留一个 Access TTL
    previous-public-keys: {}
  security:
    # Refresh Token 只走 HttpOnly Cookie，浏览器脚本不可读
    refresh-cookie:
      name: recruit_rt
      http-only: true
      secure: ${COOKIE_SECURE:true}
      same-site: Strict
      path: /api/auth
      expose-in-body: ${REFRESH_COOKIE_BODY:false}   # 仅 local 联调允许响应体返回
    # 登录失败锁定口径（P1-3 使用）
    login:
      max-failures: 5
      lock-minutes: 15
