server:
  port: 8081

spring:
  application:
    name: auth-service
  config:
    import: optional:nacos:auth-service-dev.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        fail-fast: false
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/recruit_auth?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: false   # W1 起改 true；DDL 母版见仓库根 sql/01_recruit_auth.sql（sql/README.md）
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id        # 雪花 ID（应用层生成）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  pattern:
    level: '%5p [%X{traceId}]'

# JWT（双令牌，密钥从环境变量/Nacos 加密配置注入，严禁入库/入仓）
recruit:
  jwt:
    issuer: recruit-auth
    access-token-ttl-minutes: 120    # 2h
    refresh-token-ttl-days: 7        # 7d
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}   # RS256 私钥（K8s Secret/环境变量）
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
