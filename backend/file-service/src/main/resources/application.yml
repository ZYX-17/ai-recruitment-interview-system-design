server:
  port: 8087

spring:
  application:
    name: file-service
  config:
    import: optional:nacos:file-service-dev.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        fail-fast: false
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/recruit_file?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 500MB        # 录像 ≤500MB；简历另按 biz_type 校验 ≤20MB
      max-request-size: 500MB
  flyway:
    enabled: true    # 建表由 V1_0__init_file.sql 完成；DDL 母版见 sql/06_recruit_file.sql
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  pattern:
    level: '%5p [%X{traceId}]'

# MinIO（密钥从环境变量注入）
recruit:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:recruit}
    presign-ttl-minutes: 10
    init-bucket: true
  # 服务间调用令牌（/internal/**）；生产环境必须通过 INTERNAL_TOKEN 注入
  internal:
    token: ${INTERNAL_TOKEN:dev-internal-token}
