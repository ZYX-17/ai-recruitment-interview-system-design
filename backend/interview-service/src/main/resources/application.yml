server:
  port: 8083

spring:
  application:
    name: interview-service
  config:
    import: optional:nacos:interview-service-dev.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        fail-fast: false
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/recruit_interview?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated   # Outbox publisher confirms
    publisher-returns: true
  flyway:
    enabled: true    # V1_0 与 sql/02_recruit_interview.sql 同源
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  pattern:
    level: '%5p [%X{traceId}]'

# 服务间内部接口令牌（/internal/** 必填；未配置时一律 403 fail-closed）
recruit:
  security:
    internal-token: ${INTERNAL_TOKEN:}
  interview:
    # 房间页前缀：邀约 joinUrl = 前缀 + /{roomId}（room.created 回填后才发邀约）
    join-base-url: ${INTERVIEW_JOIN_BASE_URL:http://localhost:5173/room}
  async:
    # 门户异步面试邀请链接前缀；明文 token 只拼在链接里，不落库/不进 MQ
    invite-base-url: ${ASYNC_INVITE_BASE_URL:http://localhost:5173/portal/async-interview}
    invite-ttl-hours: ${ASYNC_INVITE_TTL_HOURS:168}
