server:
  port: 8084

spring:
  application:
    name: resume-service
  config:
    import: optional:nacos:resume-service-dev.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        fail-fast: false
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/recruit_resume?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
  elasticsearch:
    uris: ${ES_URI:http://127.0.0.1:9200}
  flyway:
    enabled: false   # W1 起改 true；DDL 母版见 sql/04_recruit_resume.sql
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  pattern:
    level: '%5p [%X{traceId}]'

# ES 检索配置（resume_vec：dense_vector 512 维 bge-small-zh-v1.5 + ik + BM25/kNN RRF）
recruit:
  es:
    resume-index: resume_vec
    vector-dims: 512
  # ES 挂时切 mysql-like（Nacos 开关）
  search:
    fallback-to-mysql: ${SEARCH_FALLBACK:false}
