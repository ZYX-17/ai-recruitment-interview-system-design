server:
  port: 8084

spring:
  application:
    name: resume-service
  config:
    import: optional:nacos:resume-service-dev.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        fail-fast: false
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/recruit_resume?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # MQ_ENABLED=false 时不启动消费者，最小档只跑 HTTP/DB
        auto-startup: ${MQ_ENABLED:true}
        # 失败不无限重投：坏消息进 {queue}.dlq，避免毒消息循环
        default-requeue-rejected: false
  elasticsearch:
    uris: ${ES_URI:http://127.0.0.1:9200}
  flyway:
    enabled: true    # 建表由 V1_0__init_resume.sql 完成；DDL 母版见 sql/04_recruit_resume.sql
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  pattern:
    level: '%5p [%X{traceId}]'

# ES 检索配置（resume_vec：dense_vector 512 维 bge-small-zh-v1.5 + ik + BM25/kNN RRF）
recruit:
  es:
    resume-index: resume_vec
    vector-dims: 512
    # IK 插件未安装时自动回退 standard
    analyzer: ${ES_ANALYZER:ik_max_word}
  # ES 挂时切 mysql-like（Nacos 开关）
  search:
    # es / mysql-like；mysql-like 时不依赖 ES
    mode: ${SEARCH_MODE:es}
    fallback-to-mysql: ${SEARCH_FALLBACK:true}
    # BM25 与 kNN 各路召回 chunk 数，融合后按简历聚合
    recall-size: ${SEARCH_RECALL_SIZE:200}
    rrf-k: ${SEARCH_RRF_K:60}
    max-candidates: ${SEARCH_MAX_CANDIDATES:200}
  # ai-worker BGE embedding（不注册 Nacos，固定地址）
  ai-worker:
    url: ${AI_WORKER_URL:http://127.0.0.1:8001}
  embed:
    dims: 512
    batch-size: ${EMBED_BATCH_SIZE:32}
    # 开发/演示可降级本地 mock；生产建议 false
    fallback-mock: ${EMBED_FALLBACK_MOCK:true}
  # 雪花 ID 多实例部署时 worker-id/datacenter-id 必须各不相同（0~31）
  id:
    worker-id: ${WORKER_ID:1}
    datacenter-id: ${DATACENTER_ID:1}
  # 手机号查重 HMAC 密钥；生产环境必须通过 PHONE_PEPPER 注入随机值
  dedup:
    phone-pepper: ${PHONE_PEPPER:dev-phone-pepper}
  # 服务间内部令牌（file-service /internal/**）
  internal:
    token: ${INTERNAL_TOKEN:dev-internal-token}
  # 无 Nacos 本地开发时直连 file-service；留空则走服务发现
  file-service:
    url: ${FILE_SERVICE_URL:}
  # 事件路由（与 A 文档 §6.1 对齐：exchange=recruit.events，routingKey=eventType）
  mq:
    enabled: ${MQ_ENABLED:true}
    events-exchange: ${EVENTS_EXCHANGE:recruit.events}
    dlx: ${EVENT_DLX:recruit.dlx}
    mineru-resume-queue: ${MINERU_RESUME_QUEUE:mineru.resume-received}
    resume-parse-completed-queue: ${RESUME_PARSE_COMPLETED_QUEUE:resume.parse-completed}
    job-published-queue: ${JOB_PUBLISHED_QUEUE:resume.job-published}
    job-updated-queue: ${JOB_UPDATED_QUEUE:resume.job-updated}
  # Outbox 投递与重试
  outbox:
    exchange: ${EVENTS_EXCHANGE:recruit.events}
    poll-interval-ms: ${OUTBOX_POLL_MS:5000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
