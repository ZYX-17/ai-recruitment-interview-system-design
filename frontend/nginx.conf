# 前端容器内 Nginx：SPA 静态资源 + API/WSS 反代（本地/单机构建；生产 WSS 走独立子域名时按需调整）
# 容器网络内经 host.docker.internal 访问宿主机端口；compose 同网络时可改为服务名
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由
    location / { try_files $uri $uri/ /index.html; }

    # 业务 API → 网关
    location /api/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Trace-Id $request_id;
    }

    # 房间 WS（聊天/字幕/系统事件）→ room-service
    location /ws/room/ {
        proxy_pass http://host.docker.internal:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # ASR WSS → ai-worker 直达（scope=asr 短时令牌，AI 侧校验）
    location /api/ai/v1/asr/ {
        proxy_pass http://host.docker.internal:8001/ws/asr/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # LiveKit 信令：同域 /livekit → /rtc（生产推荐 livekit.<domain> 独立子域名）
    location /livekit {
        rewrite ^/livekit(/.*)$ /rtc$1 break;
        proxy_pass http://host.docker.internal:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
