name: recruit-app
# 应用层（7 个 Java 服务 + 前端）。用法：docker compose -f infra/docker-compose.base.yml -f infra/docker-compose.app.yml up -d
services:
  api-gateway:
    build: { context: ../backend, dockerfile: Dockerfile, args: { MODULE: api-gateway } }
    container_name: recruit-gateway
    ports: ["8080:8080"]
    environment: [ "NACOS_ADDR=host.docker.internal:8848" ]
    depends_on: [ ]

  auth-service:
    build: { context: ../backend, dockerfile: Dockerfile, args: { MODULE: auth-service } }
    container_name: recruit-auth
    ports: ["8081:8081"]

  interview-service:
    build: { context: ../backend, dockerfile: Dockerfile, args: { MODULE: interview-service } }
    container_name: recruit-interview
    ports: ["8083:8083"]

  resume-service:
    build: { context: ../backend, dockerfile: Dockerfile, args: { MODULE: resume-service } }
    container_name: recruit-resume
    ports: ["8084:8084"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NACOS_ADDR: ${NACOS_ADDR:-host.docker.internal:8848}
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-host.docker.internal}
      ES_URI: ${ES_URI:-http://host.docker.internal:9200}
      EVENTS_EXCHANGE: ${EVENTS_EXCHANGE:-recruit.events}
      FILE_SERVICE_URL: ${FILE_SERVICE_URL:-http://host.docker.internal:8087}
      AI_WORKER_URL: ${RESUME_AI_WORKER_URL:-http://host.docker.internal:8001}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      EMBED_FALLBACK_MOCK: ${EMBED_FALLBACK_MOCK:-true}
      MQ_ENABLED: ${MQ_ENABLED:-true}

  room-service:
    build: { context: ../backend, dockerfile: Dockerfile, args: { MODULE: room-service } }
    container_name: recruit-room
    ports: ["8085:8085"]

  notify-service:
    build: { context: ../backend, dockerfile: Dockerfile, args: { MODULE: notify-service } }
    container_name: recruit-notify
    ports: ["8086:8086"]

  file-service:
    build: { context: ../backend, dockerfile: Dockerfile, args: { MODULE: file-service } }
    container_name: recruit-file
    ports: ["8087:8087"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NACOS_ADDR: ${NACOS_ADDR:-host.docker.internal:8848}
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://host.docker.internal:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}

  frontend:
    build: { context: ../frontend, dockerfile: Dockerfile }
    container_name: recruit-frontend
    ports: ["80:80"]

  # 入口 Nginx（生产占 80，frontend 退为内部；本地演示 nginx 占 8088 避免冲突）
  nginx:
    image: nginx:1.25-alpine
    container_name: recruit-nginx
    ports: ["8088:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
