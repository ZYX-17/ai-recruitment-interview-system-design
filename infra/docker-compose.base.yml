name: recruit-infra
# 中间件底座（W1 一键启动）：mysql / redis / rabbitmq / nacos / minio；ES 走 profile with-es
services:
  mysql:
    image: mysql:8.0
    container_name: recruit-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      TZ: UTC
    command: >
      --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
      --default-time-zone=+00:00
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动建 7 库（sql/00_create_databases.sql）；建表由各服务 Flyway 或手动执行
      - ../sql/00_create_databases.sql:/docker-entrypoint-initdb.d/00_create_databases.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.2
    container_name: recruit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: recruit-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    # TODO(W1)：启用延迟插件 rabbitmq_delayed_message_exchange（offer 过期/跟进提醒）
    # command: sh -c "rabbitmq-plugins enable --offline rabbitmq_delayed_message_exchange && rabbitmq-server"

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: recruit-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-SecretKey012345678901234567890123456789012345678901234567890123456789}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-recruit}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-recruit}
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data

  minio:
    image: minio/minio
    container_name: recruit-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: recruit-es
    profiles: ["with-es"]      # 默认不启（应用节点内存紧时摘）；启用：--profile with-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms2g -Xmx2g
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    # TODO(W1)：IK 分词器（analysis-ik 8.13.4）需自构建镜像或 plugins 安装；向量索引 mapping 见开发文档

  livekit:
    image: livekit/livekit-server:v1.6
    container_name: recruit-livekit
    restart: unless-stopped
    ports:
      - "7880:7880"            # 信令 WSS
      - "7881:7881"            # RTC TCP 兜底
      - "50000-50100:50000-50100/udp"   # UDP 直暴露，不经 Nginx
    command: --dev --bind 0.0.0.0
    # TODO(W1 spike)：生产改用 config.yaml（TURN/TCP 443 兜底、keys 环境变量注入）

  egress:
    image: livekit/egress:v1.8
    container_name: recruit-egress
    profiles: ["with-egress"]   # 默认不启；W1 spike 通过后常开：--profile with-egress
    restart: unless-stopped
    environment:
      EGRESS_CONFIG_FILE: /etc/livekit/egress.yaml
    ports:
      - "9090:9090"            # egress RPC/排障
    volumes:
      - ./egress/egress.yaml:/etc/livekit/egress.yaml:ro
      - egress-data:/home/egress/media
    # TODO(W1 spike)：编写 egress/egress.yaml（redis 指向 base 的 redis、api-key/secret、
    #   S3 直写 MinIO recruit/recordings/ 房间合成录制 → MP4）

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  nacos-data:
  minio-data:
  es-data:
  egress-data:
