# Nginx 入口（前端静态 + 网关反代 + WSS）。UDP 50000-50100 直暴露给 LiveKit，不经 Nginx。
upstream gateway    { server host.docker.internal:8080; }
upstream room_ws    { server host.docker.internal:8085; }
upstream asr_ws     { server host.docker.internal:8001; }   # ai-worker，不经网关
upstream livekit_ws { server host.docker.internal:7880; }

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;

    # 前端静态资源（容器化时由 frontend 镜像自带 Nginx 服务，本段为本地直跑备用）
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }

    # 业务 API → 网关
    location /api/ {
        proxy_pass http://gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Trace-Id $request_id;
    }

    # 房间 WS（聊天/字幕/系统事件）→ room-service
    location /ws/room/ {
        proxy_pass http://room_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # ASR WSS → ai-worker 直达（scope=asr 短时令牌，AI 侧校验）
    location /api/ai/v1/asr/ {
        proxy_pass http://asr_ws/ws/asr/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # LiveKit 信令：同域 /livekit rewrite 到 /rtc（生产推荐独立子域名 livekit.<domain>）
    location /livekit {
        rewrite ^/livekit(/.*)$ /rtc$1 break;
        proxy_pass http://livekit_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
